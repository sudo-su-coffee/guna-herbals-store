<body class="bg-surface text-on-surface min-h-screen">
<!-- Top Navigation (Shell Implementation) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-surface dark:bg-primary-container">
<div class="flex items-center space-x-4">
<button class="active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
</div>
<h1 class="font-headline-md text-[20px] text-primary dark:text-primary-fixed-dim uppercase tracking-widest">NATURE'S ALCHEMIST</h1>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<main class="pt-24 pb-32 px-container-margin max-w-lg mx-auto">
<!-- Order Summary Section -->
<section class="mb-section-gap-sm text-center">
<span class="font-label-caps text-label-caps text-on-secondary-container mb-2 block">SECURE CHECKOUT</span>
<h2 class="font-headline-lg text-headline-lg mb-1">Total Amount</h2>
<p class="font-display-lg text-[40px] text-primary">₹4,250.00</p>
<div class="mt-4 flex items-center justify-center space-x-2 text-on-tertiary-container">
<span class="material-symbols-outlined text-sm">lock</span>
<span class="font-body-md text-body-md">SSL Encrypted Transaction</span>
</div>
</section>
<!-- Payment Methods Accordion/List -->
<div class="space-y-4">
<!-- UPI Section -->
<div class="bg-surface-card border border-outline-variant/30 p-5 shadow-sm rounded">
<div class="flex justify-between items-center mb-6">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-brand-green">account_balance_wallet</span>
<span class="font-headline-md text-headline-md">UPI Payment</span>
</div>
<span class="font-label-caps text-[9px] bg-primary text-on-primary px-2 py-1">POPULAR</span>
</div>
<div class="grid grid-cols-2 gap-3 mb-6">
<!-- Google Pay -->
<button class="flex flex-col items-center justify-center p-4 border border-outline-variant/50 hover:border-primary transition-colors bg-surface-container-lowest">
<span class="material-symbols-outlined text-primary mb-2" style="font-variation-settings: 'FILL' 1;">GoogleLogo</span>
<span class="font-label-caps text-[11px]">GOOGLE PAY</span>
</button>
<!-- PhonePe -->
<button class="flex flex-col items-center justify-center p-4 border border-outline-variant/50 hover:border-primary transition-colors bg-surface-container-lowest">
<span class="material-symbols-outlined text-primary mb-2">currency_rupee</span>
<span class="font-label-caps text-[11px]">PHONEPE</span>
</button>
</div>
<div class="relative">
<input class="w-full bg-surface-container border-none p-4 font-body-md text-body-md focus:ring-1 focus:ring-primary outline-none" placeholder="Enter UPI ID (e.g. user@bank)" type="text"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-primary font-label-caps text-label-caps px-2 py-1">VERIFY</button>
</div>
</div>
<!-- Razorpay Credit/Debit Section -->
<div class="bg-surface-card border border-outline-variant/30 p-5 shadow-sm rounded">
<div class="flex items-center space-x-3 mb-6">
<span class="material-symbols-outlined text-brand-green">credit_card</span>
<span class="font-headline-md text-headline-md">Cards via Razorpay</span>
</div>
<div class="space-y-4">
<div class="relative">
<label class="font-label-caps text-[9px] text-on-secondary-container absolute -top-2 left-3 bg-surface-card px-1">CARD NUMBER</label>
<input class="w-full border border-outline-variant/50 p-4 font-body-md text-body-md focus:border-primary outline-none bg-transparent" placeholder="0000 0000 0000 0000" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="relative">
<label class="font-label-caps text-[9px] text-on-secondary-container absolute -top-2 left-3 bg-surface-card px-1">EXPIRY</label>
<input class="w-full border border-outline-variant/50 p-4 font-body-md text-body-md focus:border-primary outline-none bg-transparent" placeholder="MM / YY" type="text"/>
</div>
<div class="relative">
<label class="font-label-caps text-[9px] text-on-secondary-container absolute -top-2 left-3 bg-surface-card px-1">CVV</label>
<input class="w-full border border-outline-variant/50 p-4 font-body-md text-body-md focus:border-primary outline-none bg-transparent" placeholder="***" type="password"/>
</div>
</div>
</div>
<div class="mt-4 flex items-center justify-between">
<div class="flex space-x-2">

<img alt="Mastercard" class="h-3 opacity-40 grayscale" data-alt="A sophisticated macro shot of the Mastercard logo on a minimalist white surface with soft directional lighting. The composition is clean and modern, following the apothecary-style design language with neutral colors and a sense of calm reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmk-hX-TjQ76piW-FHoD2RMxATr5TkEK_ftPiuYgrHdQOf_pJroELGY2KXZnYYIXqE-va3nYikUkHK7yO1vDPaHsnY7bjSeTLEzsjUCLrgCozPQeiTM3HNd5gCBEJxBpgglknbfNNNZ6Mk3dFZQnVrdRR2qtp13TF07Y3r7Td5iDoTmzcK-GbT-Sz2mD934EC4QSb7f1Qq4rZALk3lzCk-SAtoBdUTLSCszjf4_ohSEm8TkkD1A3arr8mXKRNeju-m7SRDuETDxZiI"/>
</div>
<span class="font-label-caps text-[9px] text-on-tertiary-container flex items-center">
<span class="material-symbols-outlined text-[12px] mr-1">verified_user</span>
                        SECURED BY RAZORPAY
                    </span>
</div>
</div>
<!-- Net Banking -->
<button class="w-full flex items-center justify-between p-5 bg-surface-card border border-outline-variant/30 shadow-sm rounded hover:bg-surface-container-low transition-colors">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-brand-green">account_balance</span>
<span class="font-headline-md text-headline-md">Net Banking</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
<!-- Botanical Visual Element -->
<div class="mt-12 flex justify-center opacity-10">
<span class="material-symbols-outlined text-[120px] font-thin">spa</span>
</div>
<!-- Action Button -->
<div class="fixed bottom-0 left-0 w-full bg-surface p-container-margin border-t border-outline-variant/10">
<div class="max-w-lg mx-auto">
<button class="w-full bg-primary text-on-primary py-5 font-label-caps text-price-tag tracking-widest active:scale-[0.98] transition-transform">
                    PAY ₹4,250.00 NOW
                </button>
</div>
</div>
