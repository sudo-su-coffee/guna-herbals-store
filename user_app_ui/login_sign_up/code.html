<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
    }
.bg-botanical-overlay {
    background-image: linear-gradient(rgba(26, 46, 41, 0.4), rgba(26, 46, 41, 0.4)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuDIFfCp5JjYmPWsP0tp6qbw_4ja7e8abk0TCIGoUZMWNtKgbrwPc6s2YJuKDTIeRA-5ssV6ufZeNZ2XhdcG6uQnT9ChIpw-CSvhisEfQJZQ4MzFQvUA9Nc4sHEX_CeVD1TYNFFHMt_FEXho0CfVDT71pJOVrcpt_HBSc4jePXTKPYtJTEXtjgAh8Eh0lSvLpPOBlftARU6S1g4vtvJXl7Ycm6HHuxf0dU2JY2SwHNM7HqdBXWDLUoUcrOqxXZl-cmgXQ7mXso7pemCH);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md selection:bg-brand-green selection:text-white">
<!-- Primary Layout Container: Split Screen for Web, Stacked for Mobile -->
<main class="min-h-screen flex flex-col md:flex-row">
<!-- Imagery Section (Modern Apothecary Aesthetic) -->
<section class="hidden md:flex md:w-1/2 bg-botanical-overlay items-center justify-center p-12 relative overflow-hidden" data-alt="A macro photograph of dried organic chamomile and lavender herbs scattered on a textured dark ceramic surface. The lighting is moody and dramatic with high-contrast shadows, emphasizing the tactile textures of the botanicals. The overall aesthetic is minimalist and premium, aligning with a high-end apothecary brand using deep forest greens and earth tones.">
<div class="relative z-10 text-center space-y-6 max-w-md">
<h1 class="font-display-lg text-display-lg text-on-primary leading-tight">Nature's Wisdom, Reimagined.</h1>
<p class="font-body-md text-on-primary-container text-lg italic opacity-90">"The art of healing comes from nature, not from the physician."</p>
<div class="pt-8 flex justify-center">
<span class="w-12 h-px bg-on-primary opacity-30"></span>
</div>
</div>
</section>
<!-- Form Section -->
<section class="flex-1 flex flex-col items-center justify-center p-container-margin md:p-24 bg-surface">
<!-- Brand Header (As prescribed in JSON TopAppBar but suppressed as a shell) -->
<header class="mb-12 text-center">
<h2 class="font-headline-md text-headline-md text-primary tracking-widest uppercase">NATURE'S ALCHEMIST</h2>
<div class="mt-2 flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-brand-green"></span>
<p class="font-label-caps text-label-caps text-secondary">MODERN APOTHECARY</p>
</div>
</header>
<div class="w-full max-w-sm space-y-8">
<!-- Toggle Instructions -->
<div class="text-center space-y-2">
<h3 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h3>
<p class="font-body-md text-on-surface-variant">Access your curated herbal collection</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-4">
<div class="relative group">
<label class="font-label-caps text-label-caps text-secondary mb-1 block" for="email">EMAIL ADDRESS</label>
<input class="w-full bg-transparent border-b border-outline-variant py-3 focus:outline-none focus:border-brand-green transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="elara@alchemist.com" required="" type="email"/>
</div>
<div class="relative group">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-secondary mb-1 block" for="password">PASSWORD</label>
<a class="font-label-caps text-[9px] text-brand-green hover:underline mb-1" href="#">FORGOT?</a>
</div>
<input class="w-full bg-transparent border-b border-outline-variant py-3 focus:outline-none focus:border-brand-green transition-colors font-body-md text-on-surface" id="password" name="password" required="" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="w-full py-4 bg-brand-green text-on-primary font-label-caps text-label-caps tracking-[0.2em] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                            SIGN IN
                            <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<span class="h-px flex-1 bg-outline-variant opacity-30"></span>
<span class="font-label-caps text-[9px] text-outline">OR CONTINUE WITH</span>
<span class="h-px flex-1 bg-outline-variant opacity-30"></span>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-grid-gutter">
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-on-surface">google</span>
<span class="font-label-caps text-[9px]">GOOGLE</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 border border-outline-variant hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-on-surface">File</span>
<span class="font-label-caps text-[9px]">APPLE</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center pt-8">
<p class="font-body-md text-on-surface-variant">
                        New to the Alchemist? 
                        <a class="text-brand-green font-bold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Subtle Texture Footer -->
<footer class="mt-auto pt-12 pb-4 opacity-40">
<div class="flex justify-center gap-6">
<span class="material-symbols-outlined text-sm">eco</span>
<span class="material-symbols-outlined text-sm">psychology</span>
<span class="material-symbols-outlined text-sm">spa</span>
</div>
</footer>
</section>
</main>
<!-- Visual Polish: Subtle grain texture overlay for tactile feel -->
<div class="pointer-events-none fixed inset-0 z-50 opacity-[0.03] mix-blend-multiply bg-[url('https://www.transparenttextures.com/patterns/natural-paper.png')]"></div>
</body></html>
