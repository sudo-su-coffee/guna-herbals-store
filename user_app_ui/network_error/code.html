<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#474742",
                    "error": "#ba1a1a",
                    "surface-container": "#efedec",
                    "secondary": "#5f5e59",
                    "on-tertiary-fixed": "#161d1a",
                    "on-secondary": "#ffffff",
                    "background": "#fbf9f8",
                    "secondary-fixed": "#e5e2db",
                    "primary-fixed": "#d4e6e1",
                    "on-primary-fixed-variant": "#3a4a46",
                    "surface-variant": "#e4e2e1",
                    "surface-container-high": "#eae8e6",
                    "surface-card": "#ffffff",
                    "on-surface-variant": "#424846",
                    "on-primary-container": "#778884",
                    "surface-bright": "#fbf9f8",
                    "on-background": "#1b1c1b",
                    "on-error": "#ffffff",
                    "tertiary": "#000201",
                    "tertiary-container": "#171e1b",
                    "on-surface": "#1b1c1b",
                    "surface-dim": "#dbdad8",
                    "primary-container": "#0f1f1c",
                    "tertiary-fixed-dim": "#c1c8c3",
                    "secondary-container": "#e5e2db",
                    "on-tertiary-fixed-variant": "#414845",
                    "on-primary": "#ffffff",
                    "status-sale": "#0f1f1c",
                    "on-primary-fixed": "#0e1e1b",
                    "text-muted": "rgba(15, 31, 28, 0.6)",
                    "outline-variant": "#c2c8c5",
                    "primary-fixed-dim": "#b8cac5",
                    "surface-container-highest": "#e4e2e1",
                    "on-secondary-fixed": "#1c1c18",
                    "surface-tint": "#51625e",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#c9c6c0",
                    "tertiary-fixed": "#dde4df",
                    "brand-green": "#1a2e29",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#727876",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#65645f",
                    "inverse-surface": "#303030",
                    "inverse-primary": "#b8cac5",
                    "surface": "#fbf9f8",
                    "inverse-on-surface": "#f2f0ef",
                    "on-tertiary-container": "#7f8682",
                    "surface-container-low": "#f5f3f2",
                    "border-subtle": "rgba(255, 255, 255, 0.1)",
                    "primary": "#000101"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "section-gap-sm": "2.5rem",
                    "element-gap": "0.5rem",
                    "section-gap-lg": "5rem",
                    "grid-gutter": "1rem",
                    "container-margin": "1.5rem"
            },
            "fontFamily": {
                    "headline-lg": ["Playfair Display"],
                    "body-md": ["Noto Sans"],
                    "price-tag": ["Noto Sans"],
                    "headline-md": ["Playfair Display"],
                    "display-lg": ["Playfair Display"],
                    "label-caps": ["Noto Sans"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "price-tag": ["14px", {"lineHeight": "1", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
                    "display-lg": ["60px", {"lineHeight": "1.1", "fontWeight": "400"}],
                    "label-caps": ["10px", {"lineHeight": "1.2", "letterSpacing": "0.2em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fbf9f8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background flex items-center justify-between px-container-margin h-16 w-full flat no shadows">
<button class="hover:opacity-70 transition-opacity active:scale-95 transition-transform text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Nature's Alchemist</h1>
<button class="hover:opacity-70 transition-opacity active:scale-95 transition-transform text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
</header>
<!-- Main Canvas -->
<main class="min-h-screen flex flex-col items-center justify-center px-container-margin pt-16 pb-20">
<!-- Error Content Section -->
<section class="max-w-md w-full flex flex-col items-center text-center">
<!-- Illustration Container -->
<div class="relative w-64 h-64 mb-12 flex items-center justify-center">
<div class="absolute inset-0 bg-surface-container rounded-full opacity-40 scale-110"></div>
<img alt="Botanical Illustration" class="w-full h-full object-contain mix-blend-multiply filter grayscale contrast-125" data-alt="A minimalist, high-contrast botanical illustration of a single wilting eucalyptus branch against a soft cream background. The lighting is diffused and ethereal, casting soft shadows that emphasize the tactile texture of the dried leaves. The style is that of a premium apothecary manual, with clean lines and significant whitespace, evoking a sense of quiet stillness and professional minimalism. The color palette is restricted to charcoal greys and warm off-whites." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1-qCXuuiQIzsvY9Osqw2WQ0RH1qsK5QdrYGErds7I2AbGNjvoMBtLg7uKyFiMOhvWwJFnbvSC2zp0V6v5BUYnDLBbZM8SY1qemnSc1_O6tAnTZA26UJzDGKejOq5bZzn__MIx7vTN44psdn9SxwboXiiOV_c3ZJdnAI1NmB60nui4Ugj4UVNjXALDF2FJD-UM3edmP12EBUA17r4LSg5G97_HgsXtdcsD1piGkYCEIgmfw50zOguuQ0JMrg-EvEPDj4A1y9WBJobv"/>
<!-- Overlay Disconnect Symbol -->
<div class="absolute bottom-4 right-4 bg-brand-green p-3 rounded-full shadow-sm">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="wifi_off">wifi_off</span>
</div>
</div>
<!-- Text Content -->
<div class="space-y-element-gap">
<h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Connection Interrupted</h2>
<div class="h-px w-12 bg-outline-variant mx-auto my-6"></div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto italic">
                    The ritual has been momentarily paused. Please find a quiet space with connection to resume your journey.
                </p>
</div>
<!-- Action Area -->
<div class="mt-section-gap-sm w-full space-y-4">
<button class="w-full py-5 bg-brand-green text-on-primary font-label-caps text-label-caps uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all">
                    Try Again
                </button>
<button class="w-full py-4 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps uppercase tracking-widest hover:bg-surface-container transition-colors">
                    Offline Settings
                </button>
</div>
<!-- Status Indicator -->
<div class="mt-12 flex items-center gap-2 text-on-tertiary-container">
<span class="w-1.5 h-1.5 rounded-full bg-error"></span>
<span class="font-label-caps text-[9px] uppercase tracking-tighter opacity-60">System: Awaiting Signal</span>
</div>
</section>
</main>
<!-- BottomNavBar (Suppressed as per rules for task-focused screens, but structure shown for shell integrity if this were a home destination) -->
<!-- Note: Following the 'Automatic Suppression' rule for task-focused/error screens, we keep the UI focused on the error state. No BottomNavBar is rendered here to prioritize the 'Success/Error' canvas. -->
<!-- Decorative Corner Accents -->
<div class="fixed bottom-0 left-0 p-8 pointer-events-none opacity-20">
<span class="material-symbols-outlined text-4xl" data-icon="eco">eco</span>
</div>
<div class="fixed top-20 right-0 p-8 pointer-events-none opacity-20 rotate-180">
<span class="material-symbols-outlined text-4xl" data-icon="filter_vintage">filter_vintage</span>
</div>
</body></html>
