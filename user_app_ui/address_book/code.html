<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fbf9f8;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-surface dark:bg-primary-container">
<div class="flex items-center space-x-4">
<button class="active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim uppercase tracking-widest">SAVED ADDRESSES</h1>
</div>
<button class="active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="shopping_bag">shopping_bag</span>
</button>
</header>
<main class="pt-24 pb-32 px-container-margin">
<!-- Hero Section Aesthetic -->
<section class="mb-section-gap-sm text-center">
<span class="font-label-caps text-label-caps text-on-secondary-container mb-2 block">YOUR SANCTUARY</span>
<h2 class="font-headline-lg text-headline-lg-mobile text-primary mb-4 italic">Delivery Locations</h2>
<div class="w-12 h-[1px] bg-outline-variant mx-auto mb-8"></div>
</section>
<!-- Addresses List -->
<div class="space-y-6">
<!-- Default Address Card -->
<div class="bg-surface-card border border-outline-variant/30 p-6 shadow-sm relative group transition-all duration-300">
<div class="absolute top-0 right-0 bg-primary px-3 py-1">
<span class="font-label-caps text-[9px] text-surface uppercase">DEFAULT</span>
</div>
<div class="flex justify-between items-start mb-4">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-brand-green" data-icon="home">home</span>
<h3 class="font-headline-md text-headline-md-mobile text-primary">Home Sanctuary</h3>
</div>
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
</button>
</div>
<div class="space-y-2">
<p class="font-body-md text-on-surface-variant leading-relaxed">
                        1224 Juniper Lane, Suite 4B<br/>
                        Emerald Valley, Oregon 97401<br/>
                        United States
                    </p>
<div class="flex items-center space-x-2 text-on-tertiary-container pt-2">
<span class="material-symbols-outlined text-[18px]" data-icon="call">call</span>
<span class="font-price-tag text-price-tag">+1 (541) 555-0198</span>
</div>
</div>
</div>
<!-- Second Address Card -->
<div class="bg-surface-container-low border border-outline-variant/10 p-6 transition-all duration-300">
<div class="flex justify-between items-start mb-4">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-on-tertiary-container" data-icon="work">work</span>
<h3 class="font-headline-md text-headline-md-mobile text-primary">The Alchemist Lab</h3>
</div>
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
</button>
</div>
<div class="space-y-2">
<p class="font-body-md text-on-surface-variant leading-relaxed">
                        88 Botanical Boulevard<br/>
                        Portland, Oregon 97201<br/>
                        United States
                    </p>
<div class="flex items-center space-x-2 text-on-tertiary-container pt-2">
<span class="material-symbols-outlined text-[18px]" data-icon="call">call</span>
<span class="font-price-tag text-price-tag">+1 (503) 555-0122</span>
</div>
</div>
<div class="mt-6 flex space-x-4 border-t border-outline-variant/20 pt-4">
<button class="font-label-caps text-label-caps text-primary underline underline-offset-4 tracking-widest">SET AS DEFAULT</button>
<button class="font-label-caps text-label-caps text-error tracking-widest">REMOVE</button>
</div>
</div>
<!-- Add New Address Placeholder -->
<button class="w-full py-10 border-2 border-dashed border-outline-variant/40 flex flex-col items-center justify-center space-y-3 hover:bg-surface-container-highest transition-colors group">
<div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center text-outline group-hover:text-primary group-hover:border-primary transition-all">
<span class="material-symbols-outlined" data-icon="add">add</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.25em]">ADD NEW ADDRESS</span>
</button>
</div>
<!-- Botanical Visual Anchor -->
<div class="mt-section-gap-sm opacity-20 pointer-events-none">
<img alt="Botanical sketch" class="w-full h-48 object-cover grayscale mix-blend-multiply" data-alt="A delicate and minimalist charcoal botanical illustration of dried medicinal herbs and wild lavender on a textured cream parchment background. The style is vintage apothecary, with soft, feathered edges and significant negative space, evoking a sense of heritage, calm, and organic purity. Lighting is soft and diffused as if from a nearby window." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOM6mhc8qZvBXD4ooghizn9neESeZCX0fD6wtKw2diVQIyNNppspDJ_AKksLmwI-L7blWeIxrpAKFoe5W6ypCvHZbuXetq9jmq8QWB8QURaZ4bQ1sQjmDkh3h6bObAx3YQOisFJsTZw13M4kcGQS8hg5i4cb6XP4zEnsDydE7R6CN78RJ2weyPpWNApA8G1nakIAtPoy8urSemBp84SmvsHrd8QJt2AjAkeV9LAeQnzvT7JPRJHnJWXgyrpaOw5ALU0oDPzO8y-uyf"/>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface dark:bg-primary-container border-t border-outline-variant/20">
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-tertiary-container space-y-1 hover:text-primary transition-colors active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">HOME</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-tertiary-container space-y-1 hover:text-primary transition-colors active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="spa">spa</span>
<span class="font-label-caps text-label-caps">SHOP</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-tertiary-container space-y-1 hover:text-primary transition-colors active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-label-caps text-label-caps">WISHLIST</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim space-y-1 active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-label-caps">PROFILE</span>
</button>
</nav>
