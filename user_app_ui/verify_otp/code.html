<body class="bg-surface text-on-surface font-body-md text-body-md overflow-x-hidden min-h-screen flex flex-col">

<button class="mb-8 hover:opacity-70 transition-opacity active:scale-95 duration-200">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4">Verification</h1>
<p class="text-on-surface-variant max-w-[280px]">We have sent a 4-digit code to your registered mobile number.</p>
</div>

<div class="flex gap-4 justify-between max-w-[320px]">
<input class="otp-input w-16 h-20 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant/30 rounded-none transition-all duration-200" maxlength="1" placeholder="•" type="text"/>

</div>
</div>
